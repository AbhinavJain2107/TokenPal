<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TokenPal Status Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      overflow: hidden;
      width: 100%;
      height: 100%;
      padding: 8px;
    }

    /* Redesigned Symmetrical Obsidian Card */
    .panel-card {
      background: #111215;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #f4f4f5;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 20px 40px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      height: 100%;
      overflow-y: auto;
      box-sizing: border-box;
    }

    /* Header Drag Handle */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      cursor: grab;
    }
    .panel-header:active {
      cursor: grabbing;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }
    .dot-green { background-color: #10b981; }
    .dot-yellow { background-color: #f59e0b; }
    .dot-red { background-color: #ef4444; }

    .panel-title {
      font-size: 13px;
      font-weight: 600;
      color: #f4f4f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.2px;
    }

    .demo-tag {
      display: none;
      background: #f59e0b;
      color: #09090b;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      outline: none;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #f4f4f5;
    }
    .icon-btn.active {
      color: #f4f4f5;
      background: rgba(255, 255, 255, 0.16);
    }

    /* Integrated Metric Hero Box */
    .hero-metric-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .metric-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .metric-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .metric-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #71717a;
    }
    .percent-large {
      font-size: 28px;
      font-weight: 800;
      color: #f4f4f5;
      line-height: 1;
      letter-spacing: -0.5px;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
    .metric-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .plan-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #d4d4d8;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .reset-line {
      font-size: 11px;
      color: #a1a1aa;
      cursor: help;
    }

    /* Integrated Progress Bar */
    .bar-container {
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      width: 100%;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: #10b981;
      border-radius: 3px;
      transition: width 0.3s ease, background 0.3s ease;
    }

    /* Plain Language Message */
    .message-line {
      font-size: 12px;
      line-height: 1.4;
      color: #d4d4d8;
      font-weight: 500;
      min-height: 18px;
      padding: 0 2px;
    }

    /* Symmetrical Action Grid */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    button.btn {
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    button.btn-secondary {
      background: #18191e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #a1a1aa;
    }
    button.btn-secondary:hover {
      background: #22232a;
      border-color: rgba(255, 255, 255, 0.15);
      color: #f4f4f5;
    }
    button.btn-primary {
      background: #27272a;
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f4f4f5;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    button.btn-primary:hover {
      background: #323238;
      border-color: rgba(255, 255, 255, 0.28);
      color: #fff;
    }

    /* Collapsible Details Panel */
    .details-panel {
      display: none;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      color: #a1a1aa;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 8px 10px;
      overflow-y: auto;
      max-height: 130px;
    }
    .detail-row {
      line-height: 1.35;
    }

    /* Footer Row */
    .panel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 10px;
      color: #71717a;
    }
  </style>
</head>
<body>

  <div class="panel-card" id="panelCard">
    <!-- Header row: status dot, plain language title, pin toggle, close button -->
    <div class="panel-header" id="panelHeader">
      <div class="header-left">
        <span class="status-dot dot-green" id="statusDot"></span>
        <span class="panel-title" id="panelTitle">All good</span>
        <span class="demo-tag" id="demoTag">DEMO</span>
      </div>
      <div class="header-controls">
        <button class="icon-btn" id="btnPin" title="Pin panel open">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="17" x2="12" y2="22"></line>
            <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
          </svg>
        </button>
        <button class="icon-btn" id="btnClose" title="Close (Esc)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Integrated Metric Hero Box -->
    <div class="hero-metric-box">
      <div class="metric-row">
        <div class="metric-left">
          <span class="metric-label">Weekly Quota</span>
          <div class="percent-large" id="percentLarge">0%</div>
        </div>
        <div class="metric-right">
          <div class="plan-badge" id="planBadge">PLAN</div>
          <div class="reset-line" id="resetLine" title="Scheduled reset time">Resets in -</div>
        </div>
      </div>
      <!-- Progress Bar Integrated inside Hero Box -->
      <div class="bar-container">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <!-- Context & Activity Row -->
      <div class="context-subrow" id="contextSubrow" style="display: none; align-items: center; justify-content: space-between; font-size: 11px; color: #a1a1aa; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 2px;">
        <div style="display: flex; align-items: center; gap: 5px;">
          <span style="color: #71717a; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Context:</span>
          <span id="heroContextVal" style="color: #f4f4f5; font-weight: 600;">-</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 10px;">
          <span id="heroTurnVal" style="color: #a1a1aa;">Turn -</span>
          <span id="heroCacheVal" style="color: #34d399; font-weight: 500;"></span>
        </div>
      </div>
    </div>

    <!-- Plain-Language Message Line (Never internal rule name) -->
    <div class="message-line" id="messageLine">Quota is healthy · Sustainable pace</div>

    <!-- Perfectly Symmetrical Action Grid -->
    <div class="actions-grid">
      <button class="btn btn-primary" id="btnSnooze">Snooze 30m</button>
      <button class="btn btn-secondary" id="btnDismiss">Dismiss</button>
    </div>
    <div class="actions-grid">
      <button class="btn btn-secondary" id="btnDetails">
        <span>Details</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="btn btn-secondary" id="btnCustomize" title="Customize mascot">
        <span>Customize</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/></svg>
      </button>
    </div>

    <!-- Collapsible Details Section -->
    <div class="details-panel" id="detailsPanel">
      <div class="detail-row" id="detRequestCost" style="display: none; color: #34d399;"></div>
      <div class="detail-row" id="detModelBadge" style="display: none; color: #e4e4e7;"></div>
      <div class="detail-row" id="detProjection" style="display: none; color: #fbbf24;"></div>
      <div class="detail-row" id="detEarlyResets" style="display: none; color: #f59e0b;"></div>
      <div class="detail-row" id="detStaleReason" style="display: none; color: #f87171;"></div>
      <div class="detail-row" id="detAdvice" style="display: none; color: #f4f4f5; font-weight: 500;"></div>
      <div class="detail-row" style="color: #71717a; font-size: 10px;">ℹ️ Meter reflects usage across all active sessions</div>
      <div class="detail-row">Context: <span id="detContext">0</span> tokens | Turn: <span id="detTurn">0</span></div>
      <div style="margin-top: 6px;">
        <button class="btn btn-primary" id="btnHandoff" style="width: 100%;">Copy Handoff</button>
      </div>
    </div>

    <!-- Footer: small as-of time text -->
    <div class="panel-footer">
      <span id="asOfFooter">updated -</span>
      <span style="opacity: 0.6;">TokenPal</span>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const panelHeader = document.getElementById('panelHeader');
    const statusDot = document.getElementById('statusDot');
    const panelTitle = document.getElementById('panelTitle');
    const demoTag = document.getElementById('demoTag');
    const btnPin = document.getElementById('btnPin');
    const btnClose = document.getElementById('btnClose');
    const percentLarge = document.getElementById('percentLarge');
    const planBadge = document.getElementById('planBadge');
    const barFill = document.getElementById('barFill');
    const resetLine = document.getElementById('resetLine');
    const messageLine = document.getElementById('messageLine');
    const btnSnooze = document.getElementById('btnSnooze');
    const btnDismiss = document.getElementById('btnDismiss');
    const btnDetails = document.getElementById('btnDetails');
    const btnCustomize = document.getElementById('btnCustomize');
    const btnHandoff = document.getElementById('btnHandoff');
    const detailsPanel = document.getElementById('detailsPanel');
    const asOfFooter = document.getElementById('asOfFooter');
    const contextSubrow = document.getElementById('contextSubrow');
    const heroContextVal = document.getElementById('heroContextVal');
    const heroTurnVal = document.getElementById('heroTurnVal');
    const heroCacheVal = document.getElementById('heroCacheVal');

    // Details elements
    const detRequestCost = document.getElementById('detRequestCost');
    const detModelBadge = document.getElementById('detModelBadge');
    const detProjection = document.getElementById('detProjection');
    const detEarlyResets = document.getElementById('detEarlyResets');
    const detStaleReason = document.getElementById('detStaleReason');
    const detAdvice = document.getElementById('detAdvice');
    const detContext = document.getElementById('detContext');
    const detTurn = document.getElementById('detTurn');

    let isPinned = false;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    // Draggable header via renderer mouse events + IPC (no -webkit-app-region)
    panelHeader.addEventListener('mousedown', (e) => {
      // Don't drag if clicking buttons inside header
      if (e.target.closest('.header-controls')) return;
      if (e.button !== 0) return;
      isDragging = true;
      dragStartX = e.screenX;
      dragStartY = e.screenY;
      ipcRenderer.send('panel:drag-start');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.screenX - dragStartX;
      const deltaY = e.screenY - dragStartY;
      if (Math.abs(deltaX) > 0 || Math.abs(deltaY) > 0) {
        ipcRenderer.send('panel:drag-move', { deltaX, deltaY });
        dragStartX = e.screenX;
        dragStartY = e.screenY;
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        ipcRenderer.send('panel:drag-end');
      }
    });

    // Close button & Escape Key
    btnClose.addEventListener('click', () => {
      ipcRenderer.send('panel:close');
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        ipcRenderer.send('panel:close');
      }
    });

    // Pin toggle
    btnPin.addEventListener('click', () => {
      isPinned = !isPinned;
      btnPin.classList.toggle('active', isPinned);
      btnPin.title = isPinned ? 'Unpin panel' : 'Pin panel open';
      ipcRenderer.send('panel:set-pinned', isPinned);
    });

    // Buttons actions
    btnSnooze.addEventListener('click', () => {
      ipcRenderer.send('action:snooze', 30);
    });

    btnDismiss.addEventListener('click', () => {
      ipcRenderer.send('action:dismiss');
    });

    btnCustomize.addEventListener('click', () => {
      ipcRenderer.send('overlay:open-customize');
    });

    btnHandoff.addEventListener('click', () => {
      ipcRenderer.send('action:copy-handoff');
    });

    btnDetails.addEventListener('click', () => {
      const isVisible = detailsPanel.style.display === 'flex';
      const nowVisible = !isVisible;
      detailsPanel.style.display = nowVisible ? 'flex' : 'none';
      btnDetails.innerHTML = nowVisible
        ? '<span>Details</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>'
        : '<span>Details</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>';
      ipcRenderer.send('panel:resize', { expanded: nowVisible });
    });

    // Helpers to derive plain language titles (NEVER internal rule names)
    function derivePlainLanguageTitle(payload) {
      if (payload.rule === 'projected_exhaustion') {
        return 'On pace to run out early';
      }
      if (payload.rule === 'single_request_high') {
        return 'High usage on last turn';
      }
      if (payload.meter?.isStale) {
        return 'Reading is old';
      }
      if (payload.state === 'red') {
        return 'Allowance critical';
      }
      if (payload.state === 'yellow') {
        return 'Allowance notice';
      }
      return 'All good';
    }

    function updatePanel(payload) {
      if (!payload) return;

      const state = payload.state || 'green';
      const isDemo = Boolean(payload.isDemo || (payload.reason && payload.reason.includes('DEMO')));

      // Demo tag
      demoTag.style.display = isDemo ? 'inline-block' : 'none';

      // Status Dot
      statusDot.className = `status-dot dot-${state}`;

      // Plain language title
      panelTitle.textContent = derivePlainLanguageTitle(payload);

      // Meter percent & Plan
      if (payload.meter) {
        const used = Math.round(payload.meter.usedPercent || 0);
        percentLarge.textContent = `${used}%`;
        barFill.style.width = `${Math.min(100, Math.max(0, used))}%`;
        if (used >= 85) barFill.style.background = '#ef4444';
        else if (used >= 65) barFill.style.background = '#f59e0b';
        else barFill.style.background = '#10b981';

        planBadge.textContent = (payload.meter.planType || 'ACTIVE').toUpperCase();

        // Reset Line with full date tooltip
        const resetFormatted = payload.meter.timeToResetFormatted || '-';
        resetLine.textContent = `Resets in ${resetFormatted}`;
        if (payload.meter.resetsAtLocal) {
          resetLine.title = `Full reset date: ${payload.meter.resetsAtLocal}`;
        }

        // As of Footer
        if (payload.meter.asOfLocal) {
          asOfFooter.textContent = `updated ${payload.meter.asOfLocal}`;
        }

        // Details items
        if (payload.meter.requestCostDisplay) {
          detRequestCost.textContent = `📊 Last request: ${payload.meter.requestCostDisplay}`;
          detRequestCost.style.display = 'block';
        } else {
          detRequestCost.style.display = 'none';
        }

        if (payload.meter.modelBadgeText) {
          detModelBadge.textContent = `💡 ${payload.meter.modelBadgeText}`;
          detModelBadge.style.display = 'block';
        } else {
          detModelBadge.style.display = 'none';
        }

        if (payload.meter.projectedExhaustionText) {
          detProjection.textContent = `⏳ ${payload.meter.projectedExhaustionText}`;
          detProjection.style.display = 'block';
        } else {
          detProjection.style.display = 'none';
        }

        if (payload.meter.earlyResetsNote) {
          detEarlyResets.textContent = `⚠️ ${payload.meter.earlyResetsNote}`;
          detEarlyResets.style.display = 'block';
        } else {
          detEarlyResets.style.display = 'none';
        }

        if (payload.meter.isStale) {
          detStaleReason.textContent = `⚠️ Stale reading: ${payload.meter.staleReason || 'Older than 30m or reset passed'}`;
          detStaleReason.style.display = 'block';
        } else {
          detStaleReason.style.display = 'none';
        }
      }

      // Plain language message line (never raw rule name)
      if (payload.reason) {
        // Strip any leading DEMO prefixes or raw rule names if present
        let cleanReason = payload.reason
          .replace(/^DEMO ALERT:\s*/i, '')
          .replace(/^DEMO:\s*/i, '')
          .replace(/^TEST ALERT:\s*/i, '')
          .replace(/\[\w+\]\s*/g, '');
        messageLine.textContent = cleanReason || 'Quota is healthy · Sustainable pace';
      } else {
        messageLine.textContent = 'Quota is healthy · Sustainable pace';
      }

      // Advice in details
      if (payload.advice) {
        detAdvice.textContent = `Action: ${payload.advice}`;
        detAdvice.style.display = 'block';
      } else {
        detAdvice.style.display = 'none';
      }

      if (typeof payload.contextTokens === 'number' && payload.contextTokens > 0) {
        const tok = payload.contextTokens;
        const formatted = tok >= 1000000 
          ? (tok / 1000000).toFixed(1) + 'M' 
          : tok >= 1000 
            ? (tok / 1000).toFixed(1) + 'k' 
            : tok.toString();
        heroContextVal.textContent = `${formatted} tokens`;
        detContext.textContent = tok.toLocaleString();
        contextSubrow.style.display = 'flex';
      } else {
        contextSubrow.style.display = 'none';
      }

      if (payload.turnIndex) {
        heroTurnVal.textContent = `Turn #${payload.turnIndex}`;
        detTurn.textContent = payload.turnIndex;
      } else {
        heroTurnVal.textContent = '';
      }

      if (typeof payload.contextTokens === 'number' && typeof payload.cachedTokens === 'number' && payload.contextTokens > 0) {
        const cachePct = Math.round((payload.cachedTokens / payload.contextTokens) * 100);
        heroCacheVal.textContent = `· ${cachePct}% cached`;
      } else {
        heroCacheVal.textContent = '';
      }
    }

    // IPC Listeners
    ipcRenderer.on('panel:update', (event, data) => {
      updatePanel(data);
    });

    ipcRenderer.on('panel:init-state', (event, { data, isPinned: pinned }) => {
      isPinned = Boolean(pinned);
      btnPin.classList.toggle('active', isPinned);
      btnPin.title = isPinned ? 'Unpin panel' : 'Pin panel open';
      if (data) updatePanel(data);
    });
  </script>
</body>
</html>
