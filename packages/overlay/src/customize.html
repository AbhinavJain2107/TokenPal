<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TokenPal Mascot Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111215;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
      overflow-y: auto;
      height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }
    .header h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #f4f4f5;
    }
    .btn-close {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #a1a1aa;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.15s;
    }
    .btn-close:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #f4f4f5;
    }

    /* Live Preview Box */
    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .preview-canvas-box {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    canvas#previewCanvas {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .preview-name {
      font-size: 13px;
      font-weight: 600;
      color: #e4e4e7;
      margin-top: 8px;
    }

    /* Form Sections */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #71717a;
      margin-top: 14px;
      margin-bottom: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      color: #d4d4d8;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .form-hint {
      font-size: 11px;
      color: #71717a;
      margin-top: 3px;
    }

    input[type="text"], select {
      width: 100%;
      background: #18191e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 7px;
      color: #f4f4f5;
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, select:focus {
      border-color: rgba(255, 255, 255, 0.35);
    }

    /* Animal Grid */
    .skin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 6px;
    }
    .skin-card {
      background: #18191e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .skin-card:hover {
      background: #22232a;
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }
    .skin-card.active {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 4px 12px rgba(0, 0, 0, 0.4);
    }
    .skin-thumb {
      width: 48px;
      height: 48px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .skin-card-label {
      font-size: 11px;
      font-weight: 600;
      color: #e4e4e7;
      text-align: center;
    }

    /* Tint Chips */
    .tint-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .tint-chip {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #18191e;
      color: #a1a1aa;
      transition: all 0.15s;
    }
    .tint-chip:hover {
      background: #22232a;
      color: #f4f4f5;
    }
    .tint-chip.active {
      background: #f4f4f5;
      color: #09090b;
      border-color: #ffffff;
      font-weight: 600;
    }

    /* Accessories Checkboxes */
    .accessories-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 4px;
    }
    .accessory-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }
    .accessory-item input {
      cursor: pointer;
    }

    /* Sliders */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slider-container input[type="range"] {
      flex: 1;
      cursor: pointer;
    }
    .slider-val {
      font-size: 12px;
      font-weight: 600;
      color: #f4f4f5;
      width: 42px;
      text-align: right;
    }

    /* Toggles */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }

    .footer {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    button.btn-primary {
      background: #27272a;
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f4f4f5;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    button.btn-primary:hover {
      background: #323238;
      border-color: rgba(255, 255, 255, 0.28);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>TokenPal Mascot Studio</h2>
    <button class="btn-close" id="btnClose">✕</button>
  </div>

  <!-- Live Mascot Preview -->
  <div class="preview-container">
    <div class="preview-canvas-box">
      <canvas id="previewCanvas" width="32" height="32"></canvas>
    </div>
    <div class="preview-name" id="previewNameLabel">Pal</div>
  </div>

  <!-- Skin & Species Grid (Animated on hover) -->
  <div class="section-title">Animal Species</div>
  <div class="skin-grid" id="skinGrid"></div>
  <div class="form-hint" id="skinMetaHint" style="margin-bottom: 12px;"></div>

  <div class="form-group">
    <label class="form-label">Mascot Name</label>
    <input type="text" id="mascotName" maxlength="24" placeholder="Pal" />
  </div>

  <!-- Visibility Mode Setting -->
  <div class="section-title">Visibility & Behavior</div>
  <div class="form-group">
    <label class="form-label">Mascot Visibility</label>
    <select id="visibilitySelect">
      <option value="coding_apps">Only in coding apps (fade in/out)</option>
      <option value="always">Always visible</option>
      <option value="alerts_only">Only on alerts</option>
    </select>
    <div class="form-hint">Controls when the floating companion is displayed on screen.</div>
  </div>

  <!-- Appearance -->
  <div class="section-title">Appearance</div>
  <div class="form-group">
    <label class="form-label">Color Tint</label>
    <div class="tint-chips" id="tintChips">
      <div class="tint-chip active" data-tint="none">Original</div>
      <div class="tint-chip" data-tint="amber">Amber</div>
      <div class="tint-chip" data-tint="sapphire">Sapphire</div>
      <div class="tint-chip" data-tint="emerald">Emerald</div>
      <div class="tint-chip" data-tint="rose">Rose</div>
      <div class="tint-chip" data-tint="violet">Violet</div>
      <div class="tint-chip" data-tint="slate">Slate</div>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Accessories</label>
    <div class="accessories-grid">
      <label class="accessory-item">
        <input type="checkbox" id="accHat" />
        <span>🎩 Hat</span>
      </label>
      <label class="accessory-item">
        <input type="checkbox" id="accGlasses" />
        <span>👓 Glasses</span>
      </label>
      <label class="accessory-item">
        <input type="checkbox" id="accBow" />
        <span>🎀 Bow</span>
      </label>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Scale Size</label>
    <div class="slider-container">
      <input type="range" id="sizeSlider" min="80" max="150" step="5" value="100" />
      <span class="slider-val" id="sizeVal">100%</span>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Opacity</label>
    <div class="slider-container">
      <input type="range" id="opacitySlider" min="40" max="100" step="5" value="100" />
      <span class="slider-val" id="opacityVal">100%</span>
    </div>
  </div>

  <div class="form-group toggle-row">
    <div>
      <div class="form-label" style="margin-bottom:0">Roaming Mode</div>
      <div class="form-hint">Mascot roams edges of screen when quota is healthy</div>
    </div>
    <input type="checkbox" id="roamToggle" style="cursor:pointer" />
  </div>

  <div class="footer">
    <button class="btn-primary" id="btnDone">Done</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let currentSettings = null;
    let availableSkins = [];
    let activeSkinObj = null;
    let spriteImage = new Image();
    let spriteLoaded = false;
    let previewFrame = 0;
    let previewTimer = null;

    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = previewCanvas.getContext('2d');
    const previewNameLabel = document.getElementById('previewNameLabel');
    const skinGrid = document.getElementById('skinGrid');
    const skinMetaHint = document.getElementById('skinMetaHint');
    const mascotName = document.getElementById('mascotName');
    const visibilitySelect = document.getElementById('visibilitySelect');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeVal = document.getElementById('sizeVal');
    const opacitySlider = document.getElementById('opacitySlider');
    const opacityVal = document.getElementById('opacityVal');
    const roamToggle = document.getElementById('roamToggle');
    const accHat = document.getElementById('accHat');
    const accGlasses = document.getElementById('accGlasses');
    const accBow = document.getElementById('accBow');
    const tintChips = document.querySelectorAll('.tint-chip');

    // Request initial data from main process
    ipcRenderer.send('customize:get-data');

    ipcRenderer.on('customize:data', (event, data) => {
      currentSettings = data.settings;
      availableSkins = data.skins || [];
      initUI();
    });

    function initUI() {
      if (!currentSettings) return;

      renderSkinGrid();
      loadSelectedSkin(currentSettings.skin);

      mascotName.value = currentSettings.name || 'Pal';
      previewNameLabel.textContent = mascotName.value;

      if (currentSettings.visibilityMode) {
        visibilitySelect.value = currentSettings.visibilityMode;
      }

      sizeSlider.value = Math.round((currentSettings.size || 1.0) * 100);
      sizeVal.textContent = `${sizeSlider.value}%`;

      opacitySlider.value = Math.round((currentSettings.opacity || 1.0) * 100);
      opacityVal.textContent = `${opacitySlider.value}%`;

      roamToggle.checked = Boolean(currentSettings.roam);

      accHat.checked = Boolean(currentSettings.accessories?.hat);
      accGlasses.checked = Boolean(currentSettings.accessories?.glasses);
      accBow.checked = Boolean(currentSettings.accessories?.bow);

      // Select active tint
      const curTint = currentSettings.colorTint || 'none';
      tintChips.forEach(chip => {
        if (chip.dataset.tint === curTint) {
          chip.classList.add('active');
        } else {
          chip.classList.remove('active');
        }
      });

      startPreviewLoop();
    }

    // Render Grid of Animal Thumbnails (animated on hover)
    function renderSkinGrid() {
      skinGrid.innerHTML = '';
      for (const skin of availableSkins) {
        const card = document.createElement('div');
        card.className = `skin-card ${skin.id === currentSettings.skin ? 'active' : ''}`;
        card.dataset.skinId = skin.id;

        const canvas = document.createElement('canvas');
        canvas.width = 32;
        canvas.height = 32;
        canvas.className = 'skin-thumb';

        const label = document.createElement('div');
        label.className = 'skin-card-label';
        label.textContent = skin.name.replace('Pixel ', '');

        card.appendChild(canvas);
        card.appendChild(label);
        skinGrid.appendChild(card);

        // Load thumbnail sprite
        const thumbImg = new Image();
        let thumbFrame = 0;
        let hoverTimer = null;

        thumbImg.onload = () => {
          const tctx = canvas.getContext('2d');
          tctx.clearRect(0, 0, 32, 32);
          tctx.drawImage(thumbImg, 0, 0, 32, 32, 0, 0, 32, 32);
        };
        thumbImg.src = `file://${skin.spriteSheet}`;

        // Animate on hover
        card.addEventListener('mouseenter', () => {
          hoverTimer = setInterval(() => {
            thumbFrame = (thumbFrame + 1) % 4; // cycle through 4 idle frames
            const tctx = canvas.getContext('2d');
            tctx.clearRect(0, 0, 32, 32);
            tctx.drawImage(thumbImg, thumbFrame * 32, 0, 32, 32, 0, 0, 32, 32);
          }, 150);
        });

        card.addEventListener('mouseleave', () => {
          if (hoverTimer) clearInterval(hoverTimer);
          thumbFrame = 0;
          const tctx = canvas.getContext('2d');
          tctx.clearRect(0, 0, 32, 32);
          tctx.drawImage(thumbImg, 0, 0, 32, 32, 0, 0, 32, 32);
        });

        // Click to select skin
        card.addEventListener('click', () => {
          document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          currentSettings.skin = skin.id;
          loadSelectedSkin(skin.id);
          saveSettings();
        });
      }
    }

    function loadSelectedSkin(skinId) {
      activeSkinObj = availableSkins.find(s => s.id === skinId) || availableSkins[0];
      if (!activeSkinObj) return;

      skinMetaHint.textContent = `${activeSkinObj.name} · Author: ${activeSkinObj.author} · License: ${activeSkinObj.license}`;

      if (activeSkinObj.spriteSheet) {
        spriteLoaded = false;
        spriteImage.onload = () => {
          spriteLoaded = true;
          drawPreview();
        };
        spriteImage.src = `file://${activeSkinObj.spriteSheet}`;
      }
    }

    // Live preview render
    function drawPreview() {
      ctx.clearRect(0, 0, 32, 32);
      if (!spriteLoaded || !activeSkinObj) return;

      const fw = activeSkinObj.frameSize?.width || 32;
      const fh = activeSkinObj.frameSize?.height || 32;

      ctx.save();
      const tint = currentSettings?.colorTint || 'none';
      if (activeSkinObj.tintPalettes && activeSkinObj.tintPalettes[tint]) {
        ctx.filter = activeSkinObj.tintPalettes[tint];
      } else if (tint === 'amber') {
        ctx.filter = 'hue-rotate(20deg) saturate(1.4)';
      } else if (tint === 'sapphire') {
        ctx.filter = 'hue-rotate(180deg) saturate(1.2)';
      } else if (tint === 'emerald') {
        ctx.filter = 'hue-rotate(90deg) saturate(1.3)';
      } else if (tint === 'rose') {
        ctx.filter = 'hue-rotate(310deg) saturate(1.5)';
      } else if (tint === 'violet') {
        ctx.filter = 'hue-rotate(240deg) saturate(1.3)';
      } else if (tint === 'slate') {
        ctx.filter = 'grayscale(100%) brightness(0.9)';
      }

      ctx.drawImage(spriteImage, previewFrame * fw, 0, fw, fh, 0, 0, 32, 32);
      ctx.restore();

      // Render accessories using active skin accessoryAnchors
      const anchors = activeSkinObj.accessoryAnchors || {
        hat: { x: 11, y: 4 },
        glasses: { x: 10, y: 12 },
        bow: { x: 15, y: 23 }
      };

      if (currentSettings?.accessories?.hat) {
        const ax = anchors.hat?.x ?? 11;
        const ay = anchors.hat?.y ?? 4;
        ctx.fillStyle = '#6366f1';
        ctx.fillRect(ax, ay, 10, 4);
        ctx.fillRect(ax - 3, ay + 3, 16, 2);
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(ax, ay + 2, 10, 1);
      }

      if (currentSettings?.accessories?.glasses) {
        const gx = anchors.glasses?.x ?? 10;
        const gy = anchors.glasses?.y ?? 12;
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(gx, gy, 5, 4);
        ctx.fillRect(gx + 7, gy, 5, 4);
        ctx.fillRect(gx + 5, gy + 1, 2, 1);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(gx + 1, gy + 1, 3, 2);
        ctx.fillRect(gx + 8, gy + 1, 3, 2);
      }

      if (currentSettings?.accessories?.bow) {
        const bx = anchors.bow?.x ?? 15;
        const by = anchors.bow?.y ?? 23;
        ctx.fillStyle = '#ec4899';
        ctx.fillRect(bx - 2, by - 1, 2, 2);
        ctx.fillRect(bx + 2, by - 1, 2, 2);
        ctx.fillRect(bx, by, 2, 2);
      }
    }

    function startPreviewLoop() {
      if (previewTimer) clearInterval(previewTimer);
      previewTimer = setInterval(() => {
        previewFrame = (previewFrame + 1) % 4; // cycle idle frames
        drawPreview();
      }, 1000 / (activeSkinObj?.fps || 6));
    }

    function saveSettings() {
      if (!currentSettings) return;

      currentSettings.name = mascotName.value.trim() || 'Pal';
      currentSettings.visibilityMode = visibilitySelect.value;
      currentSettings.size = parseFloat(sizeSlider.value) / 100;
      currentSettings.opacity = parseFloat(opacitySlider.value) / 100;
      currentSettings.roam = roamToggle.checked;

      if (!currentSettings.accessories) currentSettings.accessories = {};
      currentSettings.accessories.hat = accHat.checked;
      currentSettings.accessories.glasses = accGlasses.checked;
      currentSettings.accessories.bow = accBow.checked;

      ipcRenderer.send('customize:save', currentSettings);
      drawPreview();
    }

    // Event listeners
    mascotName.addEventListener('input', () => {
      previewNameLabel.textContent = mascotName.value.trim() || 'Pal';
      saveSettings();
    });

    visibilitySelect.addEventListener('change', () => {
      saveSettings();
    });

    sizeSlider.addEventListener('input', () => {
      sizeVal.textContent = `${sizeSlider.value}%`;
      saveSettings();
    });

    opacitySlider.addEventListener('input', () => {
      opacityVal.textContent = `${opacitySlider.value}%`;
      saveSettings();
    });

    roamToggle.addEventListener('change', saveSettings);
    accHat.addEventListener('change', saveSettings);
    accGlasses.addEventListener('change', saveSettings);
    accBow.addEventListener('change', saveSettings);

    tintChips.forEach(chip => {
      chip.addEventListener('click', () => {
        tintChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentSettings.colorTint = chip.dataset.tint;
        saveSettings();
      });
    });

    document.getElementById('btnClose').addEventListener('click', () => {
      ipcRenderer.send('customize:close');
    });

    document.getElementById('btnDone').addEventListener('click', () => {
      ipcRenderer.send('customize:close');
    });
  </script>
</body>
</html>
