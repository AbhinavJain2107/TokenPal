<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TokenPal Mascot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      overflow: hidden;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      transition: opacity 0.3s ease;
    }

    body.faded-out {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Info Notice Speech Bubble (auto-hides after ~6s) */
    .notice-bubble {
      display: none;
      position: relative;
      background: #18191f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 6px 12px;
      color: #f4f4f5;
      font-size: 11px;
      font-weight: 500;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      margin-bottom: 8px;
      max-width: 160px;
      text-align: center;
      pointer-events: none;
      animation: fadeIn 0.2s ease;
    }
    .notice-bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #18191f transparent;
      display: block;
      width: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mascot Character Container */
    .mascot-container {
      width: 64px;
      height: 64px;
      cursor: grab;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
      flex-shrink: 0;
    }
    .mascot-container:active {
      cursor: grabbing;
    }

    /* Canvas for Pixel Mascot Skins */
    canvas#mascotCanvas {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
    }

    /* Fallback Geometric Character SVG (hidden when canvas skin is active) */
    svg.mascot-svg {
      width: 64px;
      height: 64px;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.4));
      display: none;
    }

    .eye { fill: #f8fafc; transition: all 0.2s; }
    .pupil { fill: #0f172a; }
    .core { transition: fill 0.3s; }
    .core-green { fill: #10b981; }
    .core-yellow { fill: #f59e0b; }
    .core-red { fill: #ef4444; }
  </style>
</head>
<body>

  <!-- Notice Speech Bubble (Model Switch & Info, auto-hides after 6s) -->
  <div class="notice-bubble" id="noticeBubble">💡 Model switch notice</div>

  <!-- Mascot Character Container (Canvas pixel art or fallback SVG) -->
  <div class="mascot-container" id="mascot">
    <canvas id="mascotCanvas" width="32" height="32"></canvas>

    <!-- Fallback Minimalist Geometric Companion SVG -->
    <svg class="mascot-svg" id="mascotSvg" viewBox="0 0 64 64">
      <circle id="antennaOrb" cx="32" cy="10" r="2" class="core core-green" style="display:none;" />
      <!-- Ears -->
      <polygon points="16,16 24,6 28,16" fill="#2b2c33" stroke="#3e404b" stroke-width="1.5" />
      <polygon points="48,16 40,6 36,16" fill="#2b2c33" stroke="#3e404b" stroke-width="1.5" />
      <!-- Face body -->
      <rect x="12" y="14" width="40" height="40" rx="14" fill="#1e1f24" stroke="#3e404b" stroke-width="1.5" />
      <!-- Eyes -->
      <circle id="eyeLeft" class="eye" cx="25" cy="30" r="2.5" fill="#f4f4f5" />
      <circle id="eyeRight" class="eye" cx="39" cy="30" r="2.5" fill="#f4f4f5" />
      <!-- Snout -->
      <path d="M 30 36 L 32 38 L 34 36" stroke="#a1a1aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Status collar gem -->
      <rect id="chestCore" x="29" y="44" width="6" height="4" rx="2" class="core core-green" />
    </svg>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const noticeBubble = document.getElementById('noticeBubble');
    const mascot = document.getElementById('mascot');
    const mascotCanvas = document.getElementById('mascotCanvas');
    const ctx = mascotCanvas.getContext('2d');
    const mascotSvg = document.getElementById('mascotSvg');
    const antennaOrb = document.getElementById('antennaOrb');
    const chestCore = document.getElementById('chestCore');
    const armRight = document.getElementById('armRight');

    let currentState = 'green';
    let currentRule = '';
    let isWalking = false;
    let isLowPower = false;
    let animationActive = true;
    let activeAnimationName = 'idle';
    let healthyTicks = 0;
    let isNoticeActive = false;
    let isStaleActive = false;
    let isExpensiveRequest = false;
    let noticeTimer = null;

    // Skin & Settings State
    let currentSkin = null;
    let currentSettings = {
      skin: 'cat',
      colorTint: 'none',
      accessories: { hat: false, glasses: false, bow: false },
      size: 1.0,
      opacity: 1.0,
      name: 'Pal',
      roam: false
    };

    let spriteImg = new Image();
    let spriteLoaded = false;

    // 18 FPS Throttled Loop
    const TARGET_FPS = 18;
    const FRAME_INTERVAL = 1000 / TARGET_FPS;
    let lastFrameTime = performance.now();
    let tickCount = 0;
    let animFrameIndex = 0;
    let lastAnimStepTime = performance.now();

    function applySkin(skinDef) {
      if (!skinDef) return;
      currentSkin = skinDef;
      if (skinDef.spriteSheet) {
        spriteLoaded = false;
        spriteImg.onload = () => {
          spriteLoaded = true;
          mascotCanvas.style.display = 'block';
          mascotSvg.style.display = 'none';
        };
        spriteImg.onerror = () => {
          spriteLoaded = false;
          mascotCanvas.style.display = 'none';
          mascotSvg.style.display = 'block';
        };
        spriteImg.src = `file://${skinDef.spriteSheet}`;
      } else {
        spriteLoaded = false;
        mascotCanvas.style.display = 'none';
        mascotSvg.style.display = 'block';
      }
    }

    function applySettings(settings) {
      if (!settings) return;
      currentSettings = settings;

      const scale = typeof settings.size === 'number' ? settings.size : 1.0;
      mascot.style.transform = `scale(${scale})`;

      const opacity = typeof settings.opacity === 'number' ? settings.opacity : 1.0;
      mascot.style.opacity = opacity.toString();
    }

    // State to Animation Mapping
    function resolveCurrentAnimation() {
      if (isWalking) return 'walk';
      if (isNoticeActive) return 'happy';
      if (isExpensiveRequest || currentRule === 'single_request_high') {
        return (currentSkin?.animations?.curious) ? 'curious' : 'idle';
      }
      if (isStaleActive) return 'sleep';
      if (currentState === 'red' || currentState === 'yellow' || currentRule) return 'alert';
      if (currentState === 'green') {
        if (healthyTicks > 250 && (healthyTicks % 400 < 150)) {
          return 'sleep';
        }
        return 'idle';
      }
      return 'idle';
    }

    function getAnimationFrames(animName) {
      if (!currentSkin || !currentSkin.animations) {
        return [0];
      }
      const raw = currentSkin.animations[animName] || currentSkin.animations.idle;
      if (Array.isArray(raw)) return raw;
      if (typeof raw === 'object' && typeof raw.from === 'number' && typeof raw.to === 'number') {
        const frames = [];
        for (let i = raw.from; i <= raw.to; i++) frames.push(i);
        return frames;
      }
      return [0];
    }

    function renderCanvasFrame() {
      ctx.clearRect(0, 0, 32, 32);
      if (!spriteLoaded || !currentSkin) return;

      const fw = currentSkin.frameSize?.width || 32;
      const fh = currentSkin.frameSize?.height || 32;
      const frames = getAnimationFrames(activeAnimationName);
      const frameNum = frames[animFrameIndex % frames.length];

      ctx.save();

      // Color Tint Filter from skin palettes
      const tint = currentSettings.colorTint || 'none';
      if (currentSkin.tintPalettes && currentSkin.tintPalettes[tint]) {
        ctx.filter = currentSkin.tintPalettes[tint];
      } else if (tint === 'amber') {
        ctx.filter = 'hue-rotate(20deg) saturate(1.4)';
      } else if (tint === 'sapphire') {
        ctx.filter = 'hue-rotate(180deg) saturate(1.2)';
      } else if (tint === 'emerald') {
        ctx.filter = 'hue-rotate(90deg) saturate(1.3)';
      } else if (tint === 'rose') {
        ctx.filter = 'hue-rotate(310deg) saturate(1.5)';
      } else if (tint === 'violet') {
        ctx.filter = 'hue-rotate(240deg) saturate(1.3)';
      } else if (tint === 'slate') {
        ctx.filter = 'grayscale(100%) brightness(0.9)';
      }

      ctx.drawImage(spriteImg, frameNum * fw, 0, fw, fh, 0, 0, 32, 32);
      ctx.restore();

      // Render Accessories using per-skin accessoryAnchors
      const anchors = currentSkin.accessoryAnchors || {
        hat: { x: 11, y: 4 },
        glasses: { x: 10, y: 12 },
        bow: { x: 15, y: 23 }
      };

      if (currentSettings.accessories?.hat) {
        const ax = anchors.hat?.x ?? 11;
        const ay = anchors.hat?.y ?? 4;
        ctx.fillStyle = '#6366f1';
        ctx.fillRect(ax, ay, 10, 4);
        ctx.fillRect(ax - 3, ay + 3, 16, 2);
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(ax, ay + 2, 10, 1);
      }

      if (currentSettings.accessories?.glasses) {
        const gx = anchors.glasses?.x ?? 10;
        const gy = anchors.glasses?.y ?? 12;
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(gx, gy, 5, 4);
        ctx.fillRect(gx + 7, gy, 5, 4);
        ctx.fillRect(gx + 5, gy + 1, 2, 1);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(gx + 1, gy + 1, 3, 2);
        ctx.fillRect(gx + 8, gy + 1, 3, 2);
      }

      if (currentSettings.accessories?.bow) {
        const bx = anchors.bow?.x ?? 15;
        const by = anchors.bow?.y ?? 23;
        ctx.fillStyle = '#ec4899';
        ctx.fillRect(bx - 2, by - 1, 2, 2);
        ctx.fillRect(bx + 2, by - 1, 2, 2);
        ctx.fillRect(bx, by, 2, 2);
      }
    }

    // 18 FPS Main Render Loop
    function renderLoop(now) {
      if (!animationActive || isLowPower) return;
      requestAnimationFrame(renderLoop);

      const delta = now - lastFrameTime;
      if (delta < FRAME_INTERVAL) return;
      lastFrameTime = now - (delta % FRAME_INTERVAL);
      tickCount++;

      if (currentState === 'green') healthyTicks++;
      else healthyTicks = 0;

      activeAnimationName = resolveCurrentAnimation();

      const skinFps = Math.min(18, Math.max(1, currentSkin?.fps || 6));
      const skinFrameInterval = 1000 / skinFps;
      if (now - lastAnimStepTime >= skinFrameInterval) {
        animFrameIndex++;
        lastAnimStepTime = now;
      }

      if (spriteLoaded) {
        renderCanvasFrame();
      } else {
        // Fallback SVG animation
        if (currentState === 'green') {
          const yOffset = Math.sin(tickCount * 0.1) * 2;
          mascotSvg.style.transform = `translateY(${yOffset}px)`;
          armRight.setAttribute('d', 'M 52 34 Q 58 36 56 44');
        } else if (currentState === 'yellow') {
          const yOffset = Math.sin(tickCount * 0.15) * 3;
          mascotSvg.style.transform = `translateY(${yOffset}px)`;
          armRight.setAttribute('d', 'M 52 34 Q 58 36 56 44');
        } else if (currentState === 'red') {
          const armAngle = Math.sin(tickCount * 0.4) * 8;
          armRight.setAttribute('d', `M 52 34 Q 60 ${20 + armAngle} 58 ${16 - armAngle}`);
          const shake = (tickCount % 2 === 0) ? -1 : 1;
          mascotSvg.style.transform = `translateX(${shake}px)`;
        }
      }
    }

    requestAnimationFrame(renderLoop);

    function updateState(payload) {
      currentState = payload.state || 'green';
      currentRule = payload.rule || '';

      if (payload.animationOverride) {
        activeAnimationName = payload.animationOverride;
      }

      // Check info notice
      if (payload.notice) {
        isNoticeActive = true;
        noticeBubble.textContent = `💡 ${payload.notice}`;
        noticeBubble.style.display = 'block';
        if (noticeTimer) clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => {
          isNoticeActive = false;
          noticeBubble.style.display = 'none';
        }, 6000);
      }

      // Stale state (sleeping mascot, no popup)
      isStaleActive = Boolean(payload.meter?.isStale && !currentRule);

      // Expensive request check
      isExpensiveRequest = Boolean(payload.rule === 'single_request_high');

      antennaOrb.className.baseVal = `core core-${currentState}`;
      chestCore.className.baseVal = `core core-${currentState}`;
    }

    // Dragging & Click Handling with Movement Threshold
    const DRAG_THRESHOLD = 5;
    let isMouseDown = false;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    mascot.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isMouseDown = true;
      isDragging = false;
      dragStartX = e.screenX;
      dragStartY = e.screenY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const totalDist = Math.hypot(e.screenX - dragStartX, e.screenY - dragStartY);

      if (!isDragging && totalDist >= DRAG_THRESHOLD) {
        isDragging = true;
        ipcRenderer.send('window:drag-start');
      }

      if (isDragging) {
        const deltaX = e.screenX - dragStartX;
        const deltaY = e.screenY - dragStartY;
        ipcRenderer.send('window:drag-move', { deltaX, deltaY });
        dragStartX = e.screenX;
        dragStartY = e.screenY;
      }
    });

    window.addEventListener('mouseup', () => {
      if (!isMouseDown) return;
      isMouseDown = false;

      if (isDragging) {
        isDragging = false;
        ipcRenderer.send('window:drag-end');
      } else {
        // Simple click gesture (no drag): toggle status panel
        ipcRenderer.send('window:drag-cancel');
        ipcRenderer.send('mascot:toggle-panel');
      }
    });

    // Right-Click Context Menu
    mascot.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      ipcRenderer.send('overlay:show-context-menu');
    });

    // IPC from Main Process
    ipcRenderer.on('overlay:update', (event, data) => {
      updateState(data);
    });

    ipcRenderer.on('overlay:init-skin', (event, { skin, settings }) => {
      if (settings) applySettings(settings);
      if (skin) applySkin(skin);
    });

    ipcRenderer.on('overlay:settings-updated', (event, { skin, settings }) => {
      if (settings) applySettings(settings);
      if (skin) applySkin(skin);
    });

    ipcRenderer.on('overlay:walking', (event, walking) => {
      isWalking = Boolean(walking);
    });

    ipcRenderer.on('overlay:fade', (event, { visible }) => {
      if (visible) {
        document.body.classList.remove('faded-out');
        animationActive = true;
        requestAnimationFrame(renderLoop);
      } else {
        document.body.classList.add('faded-out');
        animationActive = false;
      }
    });

    ipcRenderer.on('overlay:low-power', (event, enabled) => {
      isLowPower = enabled;
      if (!isLowPower) {
        animationActive = true;
        requestAnimationFrame(renderLoop);
      }
    });
  </script>
</body>
</html>
